<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Results | Pinnacle Scholars</title>
    <link rel="stylesheet" href="css/result-portal.css">
    <script src="js/result-portal.js"></script>
</head>
<body>

    <!-- Dynamic Canvas Assets -->
    <div class="bg-objects">
        <!-- Technical Vector Outlines -->
        <svg class="geo-object cone" viewBox="0 0 100 100"><path d="M 50,5 L 5,85 L 95,85 Z M 5,85 Q 50,70 95,85" /></svg>
        <svg class="geo-object sphere" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" /><ellipse cx="50" cy="50" rx="45" ry="15" /></svg>
        <svg class="geo-object compass" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" /><path d="M 50,5 L 50,95 M 5,50 L 95,50 M 18,18 L 82,82 M 18,82 L 82,18" /></svg>
        <svg class="geo-object analytics" viewBox="0 0 200 100">
            <path d="M 20,80 Q 60,20 100,50 T 180,30" stroke-width="2"/>
            <circle cx="60" cy="38" r="4" fill="#fff"/>
            <circle cx="100" cy="50" r="4" fill="#fff"/>
        </svg>

        <!-- Academic Formula Watermarks -->
        <div class="math-formula math-1">min x² = ∑ (x_i + a_j³)²</div>
        <div class="math-formula math-2">y = x² (t - bx³ + b + h)</div>
        <div class="math-formula math-3">lim (x; u) = 1 / (2 sin θ)</div>
        <div class="math-formula math-4">f(a - b) = ∫(x - z) dt</div>
    </div>

    <!-- Background Active Ring -->
    <div class="portal-glow-ring"></div>

    <!-- Central Interactive Node -->
    <!-- Central Interactive Node Wrapper -->
    <div class="card-wrapper">
        <div class="card">
            <h2>Result Portal</h2>
            <div class="subtitle">Pinnacle Academy</div>
            <p class="info-text">Enter your details to view your scorecard.</p>
            
            <!-- Field 1: Roll ID Alignment -->
            <div class="form-group">
                <label for="roll-input">Roll Number</label>
                <input type="text" id="roll-input" placeholder="Enter Roll No." autocomplete="off">
            </div>
            
            <!-- Field 2: Validation Coordinates -->
            <div class="form-group">
                <label for="dob-input">Date of Birth</label>
                <input type="date" id="dob-input">
            </div>
            
            <!-- Interactive Trigger Execution -->
            <button class="btn" onclick="checkResult()">Search Result</button>
            
            <br>
            <a href="index.html" class="back">← Return Home</a>

            <div class="card-footer-decor">
                <span>⚛</span>
                <span>🧭</span>
            </div>
        </div>
    </div>

    <!-- Correctly Structured Bottom Anchored Footer Block -->
    <footer>
        <p>&copy; 2026 Pinnacle Scholars Academy, Noida. Empowering Futures.</p>
    </footer>
    <!-- Functional Local Storage Query Scripts -->
</body>
</html>
